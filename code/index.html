
  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watchly — Live Twitch & YouTube Analytics, Streams & Clips</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="nav-brand">
      <i class="fa-solid fa-bolt brand-icon"></i>
      <span class="brand-title">Watchly</span>
      <span class="brand-badge">Open Source</span>
    </div>

    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="searchInput" placeholder="Search Twitch & YouTube channels..." />
      <button id="clearSearch" class="hidden">&times;</button>
    </div>

    <a href="https://github.com/treatwashere/Watchly" target="_blank" class="github-link">
      <i class="fa-brands fa-github"></i> GitHub
    </a>
  </header>

  <!-- Main Dashboard Container -->
  <main class="main-container">

    <!-- Hero Header -->
    <section class="hero-section">
      <h1>Real-Time Stream Stats & Live Analytics</h1>
      <p>Track live follower & sub counts, active streams, viral clips, and channel performance across Twitch and YouTube.</p>
    </section>

    <!-- Filter Pills -->
    <div class="platform-pills">
      <button class="pill active" data-platform="all">
        <i class="fa-solid fa-globe"></i> All Platforms
      </button>
      <button class="pill" data-platform="twitch">
        <i class="fa-brands fa-twitch"></i> Twitch
      </button>
      <button class="pill" data-platform="youtube">
        <i class="fa-brands fa-youtube"></i> YouTube
      </button>
    </div>

    <!-- Tab Navigation -->
    <div class="tabs-nav">
      <button class="tab-btn active" data-tab="live-counts">
        <i class="fa-solid fa-square-poll-vertical"></i> Live Counters
      </button>
      <button class="tab-btn" data-tab="live-streams">
        <i class="fa-solid fa-video"></i> Live Streams (<span id="streamsCount">0</span>)
      </button>
      <button class="tab-btn" data-tab="clips-videos">
        <i class="fa-solid fa-film"></i> Clips & Videos (<span id="clipsCount">0</span>)
      </button>
      <button class="tab-btn" data-tab="channels-tab">
        <i class="fa-solid fa-users"></i> Channels (<span id="channelsCount">0</span>)
      </button>
    </div>

    <!-- Tab 1: Live Counters -->
    <div id="live-counts" class="tab-content active">
      <div class="section-title">
        <h2><i class="fa-solid fa-circle-dot live-indicator"></i> Featured Live Counts</h2>
        <span class="sync-tag"><i class="fa-solid fa-rotate"></i> Syncing live data every 2s</span>
      </div>
      <div class="grid counters-grid" id="countersGrid"></div>
    </div>

    <!-- Tab 2: Live Streams -->
    <div id="live-streams" class="tab-content">
      <div class="grid streams-grid" id="streamsGrid"></div>
    </div>

    <!-- Tab 3: Clips & Videos -->
    <div id="clips-videos" class="tab-content">
      <div class="grid clips-grid" id="clipsGrid"></div>
    </div>

    <!-- Tab 4: Channels Grid -->
    <div id="channels-tab" class="tab-content">
      <div class="grid channels-grid" id="channelsGrid"></div>
    </div>

  </main>

  <!-- Social Blade / Details Modal -->
  <div id="counterModal" class="modal hidden">
    <div class="modal-content" id="modalContainer"></div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
